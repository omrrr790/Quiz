<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Billing Quiz</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; padding: 20px; color: #202124; }
        .container { max-width: 850px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header-box { text-align: center; border-bottom: 2px solid #1a73e8; margin-bottom: 30px; padding-bottom: 10px; }
        
        #name-screen, #quiz-area, #result { display: none; }

        /* General UI */
        .btn-primary { background-color: #1a73e8; color: white; padding: 15px 60px; border: none; border-radius: 30px; font-size: 18px; cursor: pointer; font-weight: bold; }
        input[type="text"] { width: 80%; padding: 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 18px; margin-bottom: 20px; }

        /* Quiz UI */
        #timer { position: fixed; top: 20px; right: 20px; background: #d93025; color: white; padding: 12px 25px; border-radius: 50px; font-weight: bold; font-size: 22px; z-index: 1000; }
        .question { margin-bottom: 30px; padding: 25px; border-left: 6px solid #1a73e8; background: #f8f9fa; border-radius: 8px; }
        .options label { display: block; margin: 12px 0; padding: 14px; cursor: pointer; background: white; border: 1px solid #ddd; border-radius: 10px; }
        
        #submit-btn { width: 100%; padding: 20px; background: #34a853; color: white; border: none; border-radius: 10px; font-size: 22px; cursor: pointer; font-weight: bold; }

        /* Result/Review UI */
        .review-item { margin-bottom: 15px; padding: 15px; border-radius: 8px; border-width: 1px; border-style: solid; }
        .correct-review { background: #f0fff4; border-color: #68d391; }
        .wrong-review { background: #fff5f5; border-color: #feb2b2; }
        .status-badge { font-weight: bold; text-transform: uppercase; font-size: 12px; padding: 4px 10px; border-radius: 4px; margin-bottom: 8px; display: inline-block; }
        .badge-correct { background: #c6f6d5; color: #22543d; }
        .badge-wrong { background: #fed7d7; color: #822727; }
        .score-box { font-size: 60px; font-weight: bold; color: #1a73e8; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h1>Medical Billing Course</h1>
        <h3>Batch-4 Quiz #1</h3>
    </div>

    <!-- Start -->
    <div id="start-screen" style="text-align: center;">
        <p>Total MCQs: 40 | Marks: 40 | Time: 30 Mins</p>
        <button class="btn-primary" onclick="showNameScreen()">Start Quiz</button>
    </div>

    <!-- Name Input -->
    <div id="name-screen" style="text-align: center;">
        <h2>Student Name</h2>
        <input type="text" id="studentNameInput" placeholder="Enter Full Name">
        <br>
        <button class="btn-primary" onclick="startQuiz()">Begin Test</button>
    </div>

    <!-- Quiz -->
    <div id="quiz-area">
        <div id="timer">30:00</div>
        <div id="questions-container"></div>
        <button type="button" id="submit-btn" onclick="calculateScore()">Submit Test</button>
    </div>

    <!-- Results -->
    <div id="result">
        <h2 id="displayName" style="text-align: center;"></h2>
        <div class="score-box" id="final-score"></div>
        <p id="percentage" style="text-align: center; font-weight: bold;"></p>
        
        <div style="margin-top: 40px;">
            <h3 style="text-align: center;">Attempt Review</h3>
            <div id="full-review-list"></div>
        </div>
    </div>
</div>

<script>
    const questionsData = [
        ["What is the primary purpose of Revenue Cycle Management (RCM)?", "Managing financial flow from patient registration to payment collection", ["Managing hospital construction", "Tracking employee attendance", "Managing financial flow from patient registration to payment collection", "Hiring healthcare providers"]],
        ["Which platform is commonly used for eligibility verification?", "Availity", ["PECOS", "Availity", "CAQH", "OpenEMR"]],
        ["What does NPI stand for?", "National Provider Identifier", ["National Patient Insurance", "National Provider Identifier", "New Provider Index", "National Payment Information"]],
        ["How many digits are in an NPI number?", "10", ["8", "9", "10", "12"]],
        ["Which document is required for prescribing controlled substances?", "DEA Certificate", ["Passport", "DEA Certificate", "Utility bill", "Bank statement"]],
        ["What is CAQH ProView used for?", "Provider credentialing database", ["Patient scheduling", "Provider credentialing database", "Billing denial management", "Insurance payment posting"]],
        ["Which system is mandatory for Medicare enrollment?", "PECOS", ["Availity", "PECOS", "CAQH", "EMR system"]],
        ["A provider who has a contract with insurance is called:", "In-network provider", ["Out-of-network provider", "In-network provider", "Non-participating provider", "Referring provider"]],
        ["PTAN is issued by:", "MAC (Medicare contractor)", ["Commercial insurance", "MAC (Medicare contractor)", "Patient portal", "Employer"]],
        ["Who performs the medical service?", "Rendering provider", ["Billing provider", "Rendering provider", "Referring provider", "Insurance company"]],
        ["Who submits claims to insurance?", "Billing provider", ["Rendering provider", "Billing provider", "Supervising provider", "Patient"]],
        ["A doctor who refers a patient to a specialist is called:", "Referring provider", ["Attending provider", "Supervising provider", "Referring provider", "Billing provider"]],
        ["Medicare Part A covers:", "Hospital services", ["Prescription drugs", "Hospital services", "Dental care", "Vision care"]],
        ["Medicare Part D covers:", "Prescription drugs", ["Hospital care", "Doctor visits", "Prescription drugs", "Emergency care"]],
        ["Medicaid is mainly for:", "Low-income individuals", ["High-income individuals", "Low-income individuals", "Military personnel", "Foreign tourists"]],
        ["TRICARE serves:", "Military members and families", ["Students", "Military members and families", "Private employees", "Senior citizens only"]],
        ["Which is a commercial payer?", "Aetna", ["Medicare", "Medicaid", "Aetna", "TRICARE"]],
        ["HMO plans require:", "PCP referral", ["No network", "PCP referral", "No insurance card", "Cash-only payment"]],
        ["PPO plans allow:", "Flexibility to see out-of-network providers", ["Only emergency visits", "No specialists", "Flexibility to see out-of-network providers", "Only hospital visits"]],
        ["EPO plans generally:", "Cover only in-network providers", ["Cover out-of-network care", "Require referrals always", "Cover only in-network providers", "Are government programs"]],
        ["A patient returning after 4 years is:", "New patient", ["Established patient", "New patient", "Emergency patient", "Walk-in patient"]],
        ["Wave scheduling means:", "Many patients at same time slot", ["One patient per hour", "Many patients at same time slot", "Only emergency patients", "No appointments"]],
        ["Double booking means:", "Booking two patients at same time", ["Canceling appointments", "Booking two patients at same time", "Booking once a week", "Scheduling online only"]],
        ["Cluster scheduling is:", "Grouping similar appointments together", ["Random scheduling", "Grouping similar appointments together", "Emergency-only scheduling", "Walk-in system"]],
        ["First step of RCM is:", "Patient registration", ["Claim submission", "Coding", "Patient registration", "Payment posting"]],
        ["During registration, staff collect:", "Insurance and ID", ["Credit score", "Insurance and ID", "Driving license only", "Employment letter"]],
        ["Eligibility verification checks:", "Insurance active status", ["Doctor salary", "Insurance active status", "Hospital profit", "Patient job"]],
        ["Eligibility verification is done:", "24–48 hours before visit", ["After treatment", "24–48 hours before visit", "After claim denial", "After payment"]],
        ["Co-payment is:", "Fixed amount per visit", ["Annual fee", "Fixed amount per visit", "Percentage of bill", "Insurance premium"]],
        ["Deductible means:", "Amount paid before insurance starts", ["Monthly payment", "Amount paid before insurance starts", "Refund amount", "Bonus payment"]],
        ["Co-insurance is:", "Percentage patient pays after deductible", ["Fixed fee", "Percentage patient pays after deductible", "Full payment by insurance", "Annual tax"]],
        ["Out-of-pocket maximum is:", "Annual limit patient pays", ["Minimum payment", "Annual limit patient pays", "Insurance penalty", "Provider fee"]],
        ["Insurance inactive during visit results in:", "Claim denial", ["Fast approval", "Claim denial", "Bonus payment", "Automatic coverage"]],
        ["NP performs surgery under supervision. Physician role is:", "Supervising provider", ["Billing provider", "Supervising provider", "Referring provider", "Patient"]],
        ["Provider not enrolled in PECOS submits Medicare claim. Outcome:", "Denied", ["Paid instantly", "Denied", "Increased payment", "Reduced deductible"]],
        ["HMO patient sees specialist without referral. Likely result:", "Claim denial", ["Full coverage", "Claim denial", "Extra bonus", "No billing required"]],
        ["Provider agrees to discounted rates. This is:", "In-network", ["Out-of-network", "In-network", "Self-pay", "Fraud"]],
        ["Patient has $1000 deductible and $600 bill. Payment:", "$600", ["$0", "$600", "$400", "$1000"]],
        ["CV has employment gaps during credentialing. Result:", "Delay in credentialing", ["Fast approval", "Delay in credentialing", "Immediate PTAN", "Automatic approval"]],
        ["Patient reached out-of-pocket max. Next claim paid by:", "Insurance 100%", ["Patient", "Insurance 100%", "Employer", "Provider"]]
    ];

    let studentName = "";
    let timeLeft = 30 * 60;
    let timerInterval;

    function showNameScreen() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('name-screen').style.display = 'block';
    }

    function startQuiz() {
        studentName = document.getElementById('studentNameInput').value;
        if (!studentName.trim()) { alert("Please enter your name."); return; }
        document.getElementById('name-screen').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
        renderQuestions();
        startTimer();
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        questionsData.forEach((item, index) => {
            let optionsHTML = '';
            item[2].forEach(opt => {
                optionsHTML += `<label><input type="radio" name="q${index}" value="${opt}"> ${opt}</label>`;
            });
            container.innerHTML += `<div class="question"><p>Q${index + 1}: ${item[0]}</p><div class="options">${optionsHTML}</div></div>`;
        });
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerHTML = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (timeLeft <= 0) calculateScore();
            timeLeft--;
        }, 1000);
    }

    function calculateScore() {
        clearInterval(timerInterval);
        let score = 0;
        let reviewHTML = "";

        questionsData.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const userAnswer = selected ? selected.value : "Not Attempted";
            const isCorrect = (userAnswer === item[1]);
            
            if (isCorrect) score++;

            reviewHTML += `
                <div class="review-item ${isCorrect ? 'correct-review' : 'wrong-review'}">
                    <span class="status-badge ${isCorrect ? 'badge-correct' : 'badge-wrong'}">${isCorrect ? 'Correct' : 'Wrong'}</span>
                    <div style="font-weight: bold; margin-bottom: 5px;">Question ${index+1}: ${item[0]}</div>
                    <div>Your Choice: <span style="font-weight: bold; color: ${isCorrect ? '#2f855a' : '#c53030'};">${userAnswer}</span></div>
                </div>`;
        });

        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result').style.display = 'block';
        document.getElementById('displayName').innerText = studentName;
        document.getElementById('final-score').innerText = `${score} / 40`;
        document.getElementById('percentage').innerText = `Result: ${(score/40*100).toFixed(0)}%`;
        document.getElementById('full-review-list').innerHTML = reviewHTML;
        window.scrollTo(0,0);
    }
</script>

</body>
</html>
