<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM MCQs Quiz</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; padding: 20px; color: #202124; }
        .container { max-width: 850px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header-box { text-align: center; border-bottom: 2px solid #1a73e8; margin-bottom: 30px; padding-bottom: 10px; }
        
        #name-screen, #quiz-area, #result { display: none; }

        /* General UI */
        .btn-primary { background-color: #1a73e8; color: white; padding: 15px 60px; border: none; border-radius: 30px; font-size: 18px; cursor: pointer; font-weight: bold; }
        input[type="text"] { width: 80%; padding: 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 18px; margin-bottom: 20px; }

        /* Quiz UI */
        #timer { position: fixed; top: 20px; right: 20px; background: #d93025; color: white; padding: 12px 25px; border-radius: 50px; font-weight: bold; font-size: 22px; z-index: 1000; }
        .question { margin-bottom: 30px; padding: 25px; border-left: 6px solid #1a73e8; background: #f8f9fa; border-radius: 8px; }
        .options label { display: block; margin: 12px 0; padding: 14px; cursor: pointer; background: white; border: 1px solid #ddd; border-radius: 10px; }
        
        #submit-btn { width: 100%; padding: 20px; background: #34a853; color: white; border: none; border-radius: 10px; font-size: 22px; cursor: pointer; font-weight: bold; }

        /* Result/Review UI */
        .review-item { margin-bottom: 15px; padding: 15px; border-radius: 8px; border-width: 1px; border-style: solid; }
        .correct-review { background: #f0fff4; border-color: #68d391; }
        .wrong-review { background: #fff5f5; border-color: #feb2b2; }
        .status-badge { font-weight: bold; text-transform: uppercase; font-size: 12px; padding: 4px 10px; border-radius: 4px; margin-bottom: 8px; display: inline-block; }
        .badge-correct { background: #c6f6d5; color: #22543d; }
        .badge-wrong { background: #fed7d7; color: #822727; }
        .score-box { font-size: 60px; font-weight: bold; color: #1a73e8; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h1>HRM MCQs</h1>
        <h3>HR Fundamentals — Session 1 (Slides 1-10)</h3>
    </div>

    <!-- Start -->
    <div id="start-screen" style="text-align: center;">
        <p>Total MCQs: 10 | Marks: 10 | Time: 10 Mins</p>
        <button class="btn-primary" onclick="showNameScreen()">Start Quiz</button>
    </div>

    <!-- Name Input -->
    <div id="name-screen" style="text-align: center;">
        <h2>Student Name</h2>
        <input type="text" id="studentNameInput" placeholder="Enter Full Name">
        <br>
        <button class="btn-primary" onclick="startQuiz()">Begin Test</button>
    </div>

    <!-- Quiz -->
    <div id="quiz-area">
        <div id="timer">10:00</div>
        <div id="questions-container"></div>
        <button type="button" id="submit-btn" onclick="calculateScore()">Submit Test</button>
    </div>

    <!-- Results -->
    <div id="result">
        <h2 id="displayName" style="text-align: center;"></h2>
        <div class="score-box" id="final-score"></div>
        <p id="percentage" style="text-align: center; font-weight: bold;"></p>
        
        <div style="margin-top: 40px;">
            <h3 style="text-align: center;">Attempt Review</h3>
            <div id="full-review-list"></div>
        </div>
    </div>
</div>

<script>
    const questionsData = [
        ["According to the definition used in the session, Human Resource Management is best described as:", "A strategic approach to managing an organization's most valuable asset — its people", ["A clerical department that only maintains employee attendance records", "A strategic approach to managing an organization's most valuable asset — its people", "A legal team responsible only for handling employee disputes", "A finance function that calculates monthly payroll"]],
        ["The HRM definition is built around four verbs. Which set below matches them?", "Acquire, Develop, Compensate, Retain", ["Hire, Train, Pay, Fire", "Recruit, Assess, Promote, Terminate", "Acquire, Develop, Compensate, Retain", "Plan, Organize, Lead, Control"]],
        ["Which is the correct chronological order of HRM's historical evolution?", "Welfare Stage → Personnel Management → HRM Stage → Strategic HRM", ["Personnel Management → Welfare Stage → HRM Stage → Strategic HRM", "Welfare Stage → Personnel Management → HRM Stage → Strategic HRM", "HRM Stage → Welfare Stage → Strategic HRM → Personnel Management", "Strategic HRM → HRM Stage → Personnel Management → Welfare Stage"]],
        ["In the mid-1900s 'Personnel Management' stage, the role was mainly characterized by:", "Highly administrative work — payroll, compliance, discipline and record-keeping", ["Data analytics integrated into business planning", "Motivation, alignment and culture taking centre stage", "Highly administrative work — payroll, compliance, discipline and record-keeping", "Basic worker welfare, safety and housing to avoid labour unrest"]],
        ["The 'Scope of HRM' slide divides the employment relationship into three phases. Which of these correctly belongs to the 'During Employment' phase?", "Performance management", ["Workforce planning", "Performance management", "Retirement", "Resignations & separations"]],
        ["In the Personnel Management vs. HRM comparison, how does traditional Personnel Management typically view employees?", "As economic tools — an operating cost to minimize", ["As valuable human assets to develop", "As business partners and change agents", "As economic tools — an operating cost to minimize", "As strategic contributors to organizational culture"]],
        ["In the Interloop Limited case study, what actually drove the shift from Personnel Management to HRM?", "Global compliance demands from buyers such as Nike and Adidas", ["A change in government minimum wage law", "Global compliance demands from buyers such as Nike and Adidas", "A sudden shortage of factory workers", "Pressure from a labour union strike"]],
        ["Which pair correctly represents the 'two gates' of the employment relationship among the Five Core HR Functions?", "Acquisition and Separation", ["Development and Maintenance", "Compensation and Development", "Acquisition and Separation", "Maintenance and Compensation"]],
        ["The Acquisition function follows which three-step process, as shown in the slide?", "Plan → Source → Select", ["Identify → Deliver → Evaluate", "Plan → Source → Select", "Notify → Hand over → Settle", "Evaluate → Benchmark → Reward"]],
        ["What is flagged as the most common failure point within the Acquisition function?", "Unstructured interviews, which feel efficient but predict on-the-job performance poorly", ["Poor job posting design", "Excessive use of campus hiring", "Unstructured interviews, which feel efficient but predict on-the-job performance poorly", "Delayed background verification"]]
    ];

    // Paste your Google Apps Script Web App URL here (see instructions below the quiz)
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxGZhQCV2OJeqx28hyi18_zYAMpPFQ2I_NXRCjsQV21gn4olnqQ2ExoEiCIrQ-l61_5ow/exec";

    let studentName = "";
    let timeLeft = 10 * 60;
    let timerInterval;

    function sendToGoogleSheet(name, score, total) {
        if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.indexOf("PASTE_YOUR") === 0) {
            console.warn("Google Sheet URL not set — skipping sheet submission.");
            return;
        }
        const payload = new URLSearchParams();
        payload.append("name", name);
        payload.append("score", score);
        payload.append("total", total);
        payload.append("date", new Date().toLocaleString());

        fetch(GOOGLE_SHEET_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: payload.toString()
        }).catch(err => console.error("Sheet submission failed:", err));
    }

    function showNameScreen() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('name-screen').style.display = 'block';
    }

    function startQuiz() {
        studentName = document.getElementById('studentNameInput').value;
        if (!studentName.trim()) { alert("Please enter your name."); return; }
        document.getElementById('name-screen').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
        renderQuestions();
        startTimer();
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        questionsData.forEach((item, index) => {
            let optionsHTML = '';
            item[2].forEach(opt => {
                optionsHTML += `<label><input type="radio" name="q${index}" value="${opt}"> ${opt}</label>`;
            });
            container.innerHTML += `<div class="question"><p>Q${index + 1}: ${item[0]}</p><div class="options">${optionsHTML}</div></div>`;
        });
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerHTML = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (timeLeft <= 0) calculateScore();
            timeLeft--;
        }, 1000);
    }

    function calculateScore() {
        clearInterval(timerInterval);
        let score = 0;
        let reviewHTML = "";

        questionsData.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const userAnswer = selected ? selected.value : "Not Attempted";
            const isCorrect = (userAnswer === item[1]);
            
            if (isCorrect) score++;

            reviewHTML += `
                <div class="review-item ${isCorrect ? 'correct-review' : 'wrong-review'}">
                    <span class="status-badge ${isCorrect ? 'badge-correct' : 'badge-wrong'}">${isCorrect ? 'Correct' : 'Wrong'}</span>
                    <div style="font-weight: bold; margin-bottom: 5px;">Question ${index+1}: ${item[0]}</div>
                    <div>Your Choice: <span style="font-weight: bold; color: ${isCorrect ? '#2f855a' : '#c53030'};">${userAnswer}</span></div>
                    ${isCorrect ? '' : `<div>Correct Answer: <span style="font-weight: bold; color: #2f855a;">${item[1]}</span></div>`}
                </div>`;
        });

        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result').style.display = 'block';
        document.getElementById('displayName').innerText = studentName;
        document.getElementById('final-score').innerText = `${score} / 10`;
        document.getElementById('percentage').innerText = `Result: ${(score/10*100).toFixed(0)}%`;
        document.getElementById('full-review-list').innerHTML = reviewHTML;
        window.scrollTo(0,0);

        sendToGoogleSheet(studentName, score, 10);
    }
</script>

</body>
</html>
