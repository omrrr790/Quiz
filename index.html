<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 2A Quiz</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; padding: 20px; color: #202124; }
        .container { max-width: 850px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header-box { text-align: center; border-bottom: 2px solid #2f6f4f; margin-bottom: 30px; padding-bottom: 10px; }
        .header-box h1 { color: #1e4d34; margin-bottom: 4px; }
        .header-box h3 { color: #3d3d3d; font-weight: normal; }

        #name-screen, #quiz-area, #result { display: none; }

        /* General UI */
        .btn-primary { background-color: #2f6f4f; color: white; padding: 15px 60px; border: none; border-radius: 30px; font-size: 18px; cursor: pointer; font-weight: bold; }
        input[type="text"] { width: 80%; padding: 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 18px; margin-bottom: 20px; }

        /* Quiz UI */
        #timer { position: fixed; top: 20px; right: 20px; background: #d93025; color: white; padding: 12px 25px; border-radius: 50px; font-weight: bold; font-size: 22px; z-index: 1000; }
        .question { margin-bottom: 30px; padding: 25px; border-left: 6px solid #2f6f4f; background: #f8f9fa; border-radius: 8px; }
        .options label { display: block; margin: 12px 0; padding: 14px; cursor: pointer; background: white; border: 1px solid #ddd; border-radius: 10px; }

        #submit-btn { width: 100%; padding: 20px; background: #e8a33d; color: #1e4d34; border: none; border-radius: 10px; font-size: 22px; cursor: pointer; font-weight: bold; }

        /* Result/Review UI */
        .review-item { margin-bottom: 15px; padding: 15px; border-radius: 8px; border-width: 1px; border-style: solid; }
        .correct-review { background: #f0fff4; border-color: #68d391; }
        .wrong-review { background: #fff5f5; border-color: #feb2b2; }
        .status-badge { font-weight: bold; text-transform: uppercase; font-size: 12px; padding: 4px 10px; border-radius: 4px; margin-bottom: 8px; display: inline-block; }
        .badge-correct { background: #c6f6d5; color: #22543d; }
        .badge-wrong { background: #fed7d7; color: #822727; }
        .score-box { font-size: 60px; font-weight: bold; color: #2f6f4f; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h1>Module 2A Quiz</h1>
        <h3>Manpower Planning &amp; Job Analysis</h3>
    </div>

    <!-- Start -->
    <div id="start-screen" style="text-align: center;">
        <p>Total MCQs: 10 | Marks: 10 | Time: 10 Mins</p>
        <button class="btn-primary" onclick="showNameScreen()">Start Quiz</button>
    </div>

    <!-- Name Input -->
    <div id="name-screen" style="text-align: center;">
        <h2>Student Name</h2>
        <input type="text" id="studentNameInput" placeholder="Enter Full Name">
        <br>
        <button class="btn-primary" onclick="startQuiz()">Begin Test</button>
    </div>

    <!-- Quiz -->
    <div id="quiz-area">
        <div id="timer">10:00</div>
        <div id="questions-container"></div>
        <button type="button" id="submit-btn" onclick="calculateScore()">Submit Test</button>
    </div>

    <!-- Results -->
    <div id="result">
        <h2 id="displayName" style="text-align: center;"></h2>
        <div class="score-box" id="final-score"></div>
        <p id="percentage" style="text-align: center; font-weight: bold;"></p>

        <div style="margin-top: 40px;">
            <h3 style="text-align: center;">Attempt Review</h3>
            <div id="full-review-list"></div>
        </div>
    </div>
</div>

<script>
    const questionsData = [
        ["On the title slide, Module 2A's Key Focus is on human assets across which four actions?", "Acquiring, utilizing, improving, and retaining", ["Recruiting, training, evaluating, and promoting", "Acquiring, utilizing, improving, and retaining", "Hiring, paying, disciplining, and terminating", "Sourcing, onboarding, appraising, and offboarding"]],
        ["According to the Introduction slide, what is the Core Goal of Manpower Planning?", "Maximize organizational efficiency and align human assets with strategic goals", ["Minimize hiring costs at any expense", "Maximize organizational efficiency and align human assets with strategic goals", "Ensure 100% employee retention every year", "Replace all internal promotions with external hires"]],
        ["What is the first step in the Manpower Planning Process?", "Strategy Analysis — aligning HR needs with business goals", ["Gap Analysis", "Supply Forecasting", "Strategy Analysis — aligning HR needs with business goals", "Action Planning & Monitoring"]],
        ["Which forecasting tool analyzes historical operational metrics over past years to project future staffing, as illustrated by the Interloop Limited example?", "Trend Analysis", ["Ratio Analysis", "Trend Analysis", "Scatterplot Method", "Gap Analysis"]],
        ["Shaukat Khanum Hospital maintains a 1:4 nurse-to-bed ratio. How many nurses per shift are required for a new 40-bed ward?", "10 nurses per shift", ["4 nurses per shift", "40 nurses per shift", "10 nurses per shift", "8 nurses per shift"]],
        ["In the Scatterplot example, why does Daraz Pakistan plot monthly order deliveries against warehouse staff?", "To determine temporary staffing needs for the \u201c11.11\u201d sale event", ["To calculate annual employee bonuses", "To forecast next year's total revenue", "To determine temporary staffing needs for the \u201c11.11\u201d sale event", "To plan the warehouse's physical layout"]],
        ["In the Mobilink & Warid (Jazz) merger case study, how was the resulting workforce surplus managed?", "Through Voluntary Separation Schemes (VSS)", ["Through mandatory layoffs", "Through Voluntary Separation Schemes (VSS)", "Through across-the-board pay cuts", "By outsourcing all overlapping roles"]],
        ["On the Manpower Requisition Form (MRF), what does the 'Financial Impact' component capture?", "Budgeted salary, benefits tier, and cost center code", ["Title, department, grade/level, and location", "Education, experience, core skills, and start date", "Budgeted salary, benefits tier, and cost center code", "Budgeted headcount and business justification"]],
        ["What is the correct order of approvals in the MRF Workflow?", "Line Manager \u2192 Department Head (HOD) \u2192 Finance Department \u2192 HR Manager / Director", ["HR Manager \u2192 Finance \u2192 Line Manager \u2192 HOD", "Line Manager \u2192 Department Head (HOD) \u2192 Finance Department \u2192 HR Manager / Director", "Finance Department \u2192 Line Manager \u2192 HOD \u2192 HR Manager", "Department Head \u2192 HR Manager \u2192 Line Manager \u2192 Finance"]],
        ["According to the Job Analysis Overview slide, what are the two Key Outputs of Job Analysis?", "Job Descriptions (JD) and Person Specifications", ["Job Descriptions (JD) and Salary Bands", "Job Descriptions (JD) and Person Specifications", "Person Specifications and Training Plans", "Competency Matrix and Person Specifications"]]
    ];

    // Paste your Google Apps Script Web App URL here (see instructions below the quiz)
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxGZhQCV2OJeqx28hyi18_zYAMpPFQ2I_NXRCjsQV21gn4olnqQ2ExoEiCIrQ-l61_5ow/exec";

    let studentName = "";
    let timeLeft = 10 * 60;
    let timerInterval;

    function sendToGoogleSheet(name, score, total) {
        if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.indexOf("PASTE_YOUR") === 0) {
            console.warn("Google Sheet URL not set — skipping sheet submission.");
            return;
        }
        const payload = new URLSearchParams();
        payload.append("name", name);
        payload.append("score", score);
        payload.append("total", total);
        payload.append("quiz", "Module 2A (Slides 1-9)");
        payload.append("date", new Date().toLocaleString());

        fetch(GOOGLE_SHEET_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: payload.toString()
        }).catch(err => console.error("Sheet submission failed:", err));
    }

    function showNameScreen() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('name-screen').style.display = 'block';
    }

    function startQuiz() {
        studentName = document.getElementById('studentNameInput').value;
        if (!studentName.trim()) { alert("Please enter your name."); return; }
        document.getElementById('name-screen').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
        renderQuestions();
        startTimer();
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        questionsData.forEach((item, index) => {
            let optionsHTML = '';
            item[2].forEach(opt => {
                optionsHTML += `<label><input type="radio" name="q${index}" value="${opt}"> ${opt}</label>`;
            });
            container.innerHTML += `<div class="question"><p>Q${index + 1}: ${item[0]}</p><div class="options">${optionsHTML}</div></div>`;
        });
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerHTML = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (timeLeft <= 0) calculateScore();
            timeLeft--;
        }, 1000);
    }

    function calculateScore() {
        clearInterval(timerInterval);
        let score = 0;
        let reviewHTML = "";

        questionsData.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const userAnswer = selected ? selected.value : "Not Attempted";
            const isCorrect = (userAnswer === item[1]);

            if (isCorrect) score++;

            reviewHTML += `
                <div class="review-item ${isCorrect ? 'correct-review' : 'wrong-review'}">
                    <span class="status-badge ${isCorrect ? 'badge-correct' : 'badge-wrong'}">${isCorrect ? 'Correct' : 'Wrong'}</span>
                    <div style="font-weight: bold; margin-bottom: 5px;">Question ${index+1}: ${item[0]}</div>
                    <div>Your Choice: <span style="font-weight: bold; color: ${isCorrect ? '#2f855a' : '#c53030'};">${userAnswer}</span></div>
                    ${isCorrect ? '' : `<div>Correct Answer: <span style="font-weight: bold; color: #2f855a;">${item[1]}</span></div>`}
                </div>`;
        });

        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result').style.display = 'block';
        document.getElementById('displayName').innerText = studentName;
        document.getElementById('final-score').innerText = `${score} / 10`;
        document.getElementById('percentage').innerText = `Result: ${(score/10*100).toFixed(0)}%`;
        document.getElementById('full-review-list').innerHTML = reviewHTML;
        window.scrollTo(0,0);

        sendToGoogleSheet(studentName, score, 10);
    }
</script>

</body>
</html>
